services:
  db:
    image: postgis/postgis:16-3.4
    container_name: yatirimradar-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yatirimradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yatirimradar}
      POSTGRES_DB: ${POSTGRES_DB:-yatirimradar}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yatirimradar} -d ${POSTGRES_DB:-yatirimradar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
