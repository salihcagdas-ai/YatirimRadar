[project]
name = "yatirimradar"
version = "0.0.1"
description = "Map environmental impact decisions, expropriation notices, and assessed land values in Türkiye."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    # HTTP, configuration and logging
    "httpx>=0.27",
    "dnspython>=2.6",  # optional public DNS resolution for cadastral services
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    # Storage (PostGIS and bitemporal records)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "geoalchemy2>=0.15",
    # Geospatial
    "shapely>=2.0",
    "pyproj>=3.6",
    "h3>=4.0",
    "geopandas>=1.0",
    "pandas>=2.2",
    # Document parsing (HTML/PDF/XLSX)
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pypdf>=4.2",
    "openpyxl>=3.1",  # EIA decisions are published as XLSX workbooks
    # API and CLI
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    # Document extraction
    "anthropic>=0.30",
]

[project.optional-dependencies]
# Optional tools for document processing and analysis
heavy = [
    "prefect>=2.19",
    "playwright>=1.44",
    "scrapy>=2.11",
    "lightgbm>=4.3",
    "pymupdf>=1.24",  # render PDF pages for image-based extraction
]

[project.scripts]
yatirimradar = "yatirimradar.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yatirimradar"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Keep generated Alembic migrations outside the lint scope.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "N", "C4", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
